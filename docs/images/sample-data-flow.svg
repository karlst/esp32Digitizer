<text x="458" y="466" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#227968">Associate UTC with PPS</text>
<text x="458" y="496" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#227968">RX pin still to be assigned</text>
