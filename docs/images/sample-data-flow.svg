<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1260" viewBox="0 0 1920 1260" role="img"><title>ADC samples and GPS timing: data flow</title><rect width="100%" height="100%" fill="white"/>
<text x="45" y="66" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#243746">ADC samples and GPS timing</text>
<text x="45" y="106" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#697780">Sample data and captured times meet in the formatter. SD writes do not determine sample times.</text>
