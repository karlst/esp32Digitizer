<text x="1048" y="436" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#227968">GPIO1 / FSYNC: PCNT counts pulses</text>
<text x="1048" y="466" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#227968">MCPWM captures FSYNC and GPIO6 / PPS times</text>
<text x="1048" y="496" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#227968">Both timestamps use the same 160-MHz timer</text>
