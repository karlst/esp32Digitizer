<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1280" viewBox="0 0 1700 1280" role="img"><title>PPS, sample boundaries and capture clock</title><rect width="100%" height="100%" fill="white"/>
<text x="60" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#243746">PPS, sample boundaries and the capture clock</text>
<text x="60" y="124" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243746">1. Blocks</text>
<text x="60" y="188" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#227968">PPS</text>
