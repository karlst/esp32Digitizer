<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 110 1280 540">
  <desc>The Rigol output splits before a voltage divider. One branch connects directly to P4 GPIO6. The divided branch connects to ADC CH0P. ADC FSYNC, DCLK, and DOUT0 pass through the voltage translator to the P4. FSYNC connects to GPIO1. CH0N and all equipment grounds share common ground.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#245a81"/></marker>
    <style>
      text {font-family:Arial,sans-serif;fill:#233347;font-size:18px}
      .head {font-size:21px;font-weight:bold}
      .small {font-size:16px}
      .box {fill:#f1f6fa;stroke:#8199ab;stroke-width:1.6}
      .wire {fill:none;stroke:#245a81;stroke-width:2.5}
      .ground {fill:none;stroke:#667887;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="650" fill="white"/>

  <rect x="40" y="135" width="200" height="125" rx="8" class="box"/>
  <text x="140" y="167" text-anchor="middle" class="head">Rigol generator</text>
  <text x="140" y="196" text-anchor="middle">0–3.3 V square wave</text>
  <path d="M77 235 h20 v-20 h28 v20 h28 v-20 h28 v20 h22" class="wire"/>

  <rect x="1010" y="135" width="230" height="415" rx="8" class="box"/>
  <text x="1125" y="171" text-anchor="middle" class="head">ESP32-P4</text>
  <text x="1030" y="204">GPIO6: input edge</text>
  <text x="1030" y="234" class="small">MCPWM timer count</text>
  <path d="M240 200 H1010" class="wire" marker-end="url(#arrow)"/>
  <text x="615" y="180" text-anchor="middle">Direct reference path</text>
  <circle cx="295" cy="200" r="5" fill="#245a81"/>

  <path d="M295 200 V300" class="wire"/>
  <rect x="283" y="300" width="24" height="52" fill="white" stroke="#245a81" stroke-width="2.5"/>
  <path d="M295 352 V420" class="wire"/>
  <circle cx="295" cy="390" r="5" fill="#245a81"/>
  <rect x="283" y="420" width="24" height="52" fill="white" stroke="#245a81" stroke-width="2.5"/>
  <path d="M295 472 V505 m-19 0 h38 m-32 7 h26 m-20 7 h14" class="ground"/>
  <text x="65" y="361" class="head">Voltage divider</text>
  <text x="65" y="389">Two equal resistors</text>
  <text x="65" y="417" class="small">Reduced ADC input voltage</text>

  <rect x="470" y="290" width="225" height="260" rx="8" class="box"/>
  <text x="582" y="325" text-anchor="middle" class="head">ADS127L18</text>
  <text x="582" y="352" text-anchor="middle">Digitizer</text>
  <path d="M295 390 H470" class="wire" marker-end="url(#arrow)"/>
  <text x="485" y="396">CH0P</text>
  <text x="485" y="479">CH0N</text>
  <path d="M470 473 H440 V505 m-19 0 h38 m-32 7 h26 m-20 7 h14" class="ground"/>

  <rect x="795" y="290" width="130" height="260" rx="8" class="box"/>
  <text x="860" y="322" text-anchor="middle" class="head">Voltage</text>
  <text x="860" y="348" text-anchor="middle" class="head">translator</text>

  <path d="M695 390 H795 M925 390 H1010" class="wire" marker-end="url(#arrow)"/>
  <text x="745" y="379" text-anchor="middle">FSYNC</text>
  <text x="1030" y="396">GPIO1: FSYNC edge</text>
  <text x="1030" y="420" class="small">Same MCPWM timer</text>

  <path d="M695 455 H795 M925 455 H1010" class="wire" marker-end="url(#arrow)"/>
  <text x="745" y="444" text-anchor="middle">DCLK</text>
  <text x="1030" y="461">Bit clock</text>

  <path d="M695 510 H795 M925 510 H1010" class="wire" marker-end="url(#arrow)"/>
  <text x="745" y="499" text-anchor="middle">DOUT0</text>
  <text x="1030" y="516">ADC sample bits</text>

  <text x="40" y="595">Common ground: generator return, divider bottom, CH0N, translator, and P4.</text>
  <text x="40" y="625" class="small">Signal paths shown; power and ADC configuration connections omitted.</text>
</svg>
