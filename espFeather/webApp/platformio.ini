; Separate web-interface firmware. Building the parent Feather project does
; not compile this application or package its browser assets.
[platformio]
default_envs = featheresp32

[env:featheresp32]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
; Assets in data/ require a separate LittleFS filesystem upload.
board_build.filesystem = littlefs
