; Terminal firmware for the Feather. Test entry points live under test/hardware;
; src/adc and include/adc contain the reusable ADC driver.
[platformio]
extra_configs = test/platformio.ini
default_envs = ads127-p4-constant

[env]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared
