; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Build the S3 program separately from Feather. Arduino provides the runtime and
; FreeRTOS; the generic board profile controls flash/layout/toolchain defaults.
; COM4 is the last working Windows upload/debug port, not a pin assignment.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:test/buildHardwareTests.py
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
; SdFat FsVolume supports exFAT and FAT16/FAT32 over our native SDMMC adapter.
lib_deps = greiman/SdFat@2.3.1

; Let source files include shared project headers without relative paths.
build_flags =
    -I../shared
    -Isrc/backend
    -Itest/hardware
    -Isrc
    -DUSE_BLOCK_DEVICE_INTERFACE=1

; Use only while the attached Feather still runs the older version-2 parser.
; Same sampling code, shorter status frame. Default builds report v5 acquisition and recording status.
[env:legacy-feather]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_LEGACY_STATUS=1

; Parked Choke test (opt-in only): synthetic 32-bit stored words, 750 kbps initially,
; +250 kbps every 10 seconds. Start always records; the digitizer is unused.
; Upload only when authorized; Karl keeps USB on the S3 unless he says otherwise.
[env:choke-test]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_CHOKE_TEST=1

; Historical slow-clock comparison. Early tests requesting 4 MHz actually ran
; at 400 kHz before the clock correction; do not interpret them as 4-MHz results.
[env:choke-test-slow]
extends = env:choke-test
build_flags =
    ${env:choke-test.build_flags}
    -DS3_SD_CLOCK_KHZ=4000

; Intermediate clock, explicitly applied and checked from S3 hardware dividers.
[env:choke-test-10mhz]
extends = env:choke-test
build_flags =
    ${env:choke-test.build_flags}
    -DS3_SD_CLOCK_KHZ=10000

; Same 4-MHz ramp and filesystem as choke-test-slow; only the data width changes.
; D1/D2/D3 stay wired but are unused for one-bit data transfers. This separates
; transfer failures from the lower throughput expected when only D0 carries data.
[env:choke-test-onebit]
extends = env:choke-test-slow
build_flags =
    ${env:choke-test-slow.build_flags}
    -DS3_SD_WIDTH=1

; Matched-duration comparison at 250 kbps: the normal ramp overloads one-bit
; mode too quickly to assess communication reliability. Stop is host-controlled.
[env:sd-width-fourbit]
extends = env:choke-test-slow
build_flags =
    ${env:choke-test-slow.build_flags}
    -DS3_CHOKE_FIXED_RATE=1

[env:sd-width-onebit]
extends = env:sd-width-fourbit
build_flags =
    ${env:sd-width-fourbit.build_flags}
    -DS3_SD_WIDTH=1


; Commission a newly wired card with a full 64-KiB file readback at startup.
[env:storage-check]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_SD_VERIFY=1

; Diagnose wiring/timing independently of the normal 20-MHz transfer setting.
[env:storage-check-slow]
extends = env:storage-check
build_flags =
    ${env:storage-check.build_flags}
    -DS3_SD_CLOCK_KHZ=4000

; Isolate D0/clock/command from the three additional four-bit data connections.
[env:storage-check-onebit]
extends = env:storage-check-slow
build_flags =
    ${env:storage-check-slow.build_flags}
    -DS3_SD_WIDTH=1

; Standalone raw-sector comparison: excludes all recorder sources and libraries.
[env:sd-read-diagnostic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:test/buildHardwareTests.py
monitor_speed = 115200
upload_port = COM4
build_src_filter = -<*>
custom_test_source = sdCardDiagnostic.cpp
lib_ignore = bufferedWriter
build_flags = -DS3_SD_READ_DIAGNOSTIC=1

; Card removed: exercise GPIO15/D1 green, GPIO16/DAT2 red, GPIO4/D3 white.
; This build contains no SD read/write code or normal recorder sources.
[env:sd-led-diagnostic]
extends = env:sd-read-diagnostic
build_src_filter = -<*>
custom_test_source = sdLedDiagnostic.cpp
build_flags = -DS3_SD_LED_DIAGNOSTIC=1

; Card/LEDs removed: read GPIO15/D1, GPIO16/DAT2, GPIO4/D3 without driving them.
[env:sd-input-diagnostic]
extends = env:sd-read-diagnostic
build_src_filter = -<*>
custom_test_source = sdInputDiagnostic.cpp
build_flags = -DS3_SD_INPUT_DIAGNOSTIC=1

; Two-minute continuous file-write timing test, started by USB command R.
; Keep normal acquisition/Feather control out of this isolated benchmark.
[env:sd-write-timing]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<backend/sdmmcBlockDevice.cpp>
custom_test_source = sdWriteTiming.cpp
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_SD_WRITE_TIMING=1
    -DS3_SD_CLOCK_KHZ=10000
    -DS3_SD_WIDTH=4

; Matched file-write and card-transfer limits; each test runs for one minute.
[env:sd-write-timing-8k]
extends = env:sd-write-timing
build_flags =
    ${env:sd-write-timing.build_flags}
    -DS3_WRITE_BLOCK_BYTES=8192
    -DS3_SD_TRANSFER_BYTES=8192
    -DS3_WRITE_SECONDS=60

[env:sd-write-timing-16k]
extends = env:sd-write-timing
build_flags =
    ${env:sd-write-timing.build_flags}
    -DS3_WRITE_BLOCK_BYTES=16384
    -DS3_SD_TRANSFER_BYTES=16384
    -DS3_WRITE_SECONDS=60

[env:sd-write-timing-32k]
extends = env:sd-write-timing
build_flags =
    ${env:sd-write-timing.build_flags}
    -DS3_WRITE_BLOCK_BYTES=32768
    -DS3_SD_TRANSFER_BYTES=32768
    -DS3_WRITE_SECONDS=60

[env:sd-write-timing-64k]
extends = env:sd-write-timing
build_flags =
    ${env:sd-write-timing.build_flags}
    -DS3_WRITE_BLOCK_BYTES=65536
    -DS3_SD_TRANSFER_BYTES=65536
    -DS3_WRITE_SECONDS=60

; Task-generated Choke path only: PSRAM is not safe for the old cache-disabled
; per-sample ADC interrupt. Keep ordinary acquisition on its existing ring.
[env:choke-test-psram]
extends = env:choke-test-10mhz
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${env:choke-test-10mhz.build_flags}
    -DBOARD_HAS_PSRAM
    -DBUFFERED_WRITER_EXTERNAL=1
    -DBUFFERED_WRITER_CAPACITY=4194304
    -DBUFFERED_WRITER_BLOCK_BYTES=131072
    -DS3_SD_TRANSFER_BYTES=131072
    -DS3_CHOKE_INITIAL_BPS=24000000

; Fixed 26-Mbps endurance run. Stops after 30 minutes on the device, drains the
; ring and closes the recording. Keeps the parked ramp environment unchanged.
[env:sd-reliability-26mbps]
extends = env:choke-test-psram
build_flags =
    ${env:choke-test-10mhz.build_flags}
    -DBOARD_HAS_PSRAM
    -DBUFFERED_WRITER_EXTERNAL=1
    -DBUFFERED_WRITER_CAPACITY=4194304
    -DBUFFERED_WRITER_BLOCK_BYTES=131072
    -DS3_SD_TRANSFER_BYTES=131072
    -DS3_CHOKE_INITIAL_BPS=26000000
    -DS3_CHOKE_FIXED_RATE=1
    -DS3_CHOKE_DURATION_SECONDS=1800

; Same endurance load, but reserve the entire exFAT recording before generation.
[env:sd-reliability-preallocated]
extends = env:sd-reliability-26mbps
build_flags =
    ${env:sd-reliability-26mbps.build_flags}
    -DS3_PREALLOCATED_PAYLOAD_BYTES=5850000000ULL
