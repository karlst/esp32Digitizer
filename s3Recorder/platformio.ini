; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Build the S3 program separately from Feather. Arduino provides the runtime and
; FreeRTOS; the generic board profile controls flash/layout/toolchain defaults.
; COM4 is the last working Windows upload/debug port, not a pin assignment.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4

; Let source files include shared project headers without relative paths.
build_flags =
    -I../shared

; Use only while the attached Feather still runs the older version-2 parser.
; Same sampling code, shorter status frame. Default builds report v3 counters.
[env:legacy-feather]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_LEGACY_STATUS=1

