<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Digitizer</title>

    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <header class="top-bar">
        <div class="title">ESP32 Digitizer</div>
        <div class="top-status">Feather UI</div>
    </header>

    <main class="page-grid">
        <section class="left-column">
            <section class="panel panel-large">
                <div class="panel-header">Panel 1</div>
                <div class="panel-body"></div>
            </section>

            <section class="panel panel-large">
                <div class="panel-header">Panel 2</div>
                <div class="panel-body"></div>
            </section>
        </section>

        <section class="right-column">
            <section class="panel panel-large">
                <div class="panel-header">Panel 3</div>
                <div class="panel-body"></div>
            </section>

            <section class="panel">
                <div class="panel-header">Status</div>
                <div class="panel-body status-grid">
                    <div>Version</div>
                    <div id="status-version">0.1.0</div>

                    <div>System</div>
                    <div id="status-system">Ready</div>

                    <div>DAC</div>
                    <div id="status-dac">Disabled</div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">Control</div>
                <div class="panel-body control-stack">
                    <button type="button" disabled>Control 1</button>
                    <button type="button" disabled>Control 2</button>
                    <button type="button" disabled>Control 3</button>
                </div>
            </section>
        </section>
    </main>

    <section class="panel recent-events">
        <div class="panel-header">Recent Events</div>
        <div class="event-log" id="event-log">
            <div>UI loaded.</div>
            <div>Placeholder event log.</div>
        </div>
    </section>

    <script src="/app.js"></script>
</body>
</html>
