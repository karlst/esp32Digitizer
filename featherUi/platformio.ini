; This environment builds the Feather firmware, not the S3 recorder.
; The V2 board definition supplies the correct RX/TX and analog pin mappings.
[env:featheresp32]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino

monitor_speed = 115200
; Browser assets under data/ are built/uploaded as a separate LittleFS image.
board_build.filesystem = littlefs

build_flags =
    -I../shared
