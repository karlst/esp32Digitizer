; This environment builds the Feather firmware, not the S3 recorder.
; The V2 board definition supplies the correct RX/TX and analog pin mappings.
[platformio]
default_envs = featheresp32

[env:featheresp32]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino

monitor_speed = 115200
; Browser assets under data/ are built/uploaded as a separate LittleFS image.
board_build.filesystem = littlefs

build_flags =
    -I../shared

; Explicitly selected commissioning build: no web app or DAC worker is linked.
; Build only until the power checks and upload disconnections are complete.
[env:ads127-spi-check]
extends = env:featheresp32
extra_scripts = pre:test/buildHardwareTests.py
build_src_filter = -<*> +<adc/>
build_flags =
    ${env:featheresp32.build_flags}
    -Isrc/adc

; Manual bounded acquisition controller; pairs with S3 ads127-dma-check.
[env:ads127-capture-control]
extends = env:ads127-spi-check
custom_test_source = ads127CaptureControl.cpp
