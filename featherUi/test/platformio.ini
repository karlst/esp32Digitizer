; Opt-in hardware test environments. Paths are relative to the project root.
; Imported by ../platformio.ini; existing build/upload environment names are unchanged.

; Register communication test selected explicitly with this environment name.
; Its own setup/loop replaces the web application; no web DAC worker is linked.
[env:ads127-spi-check]
extends = env:featheresp32
extra_scripts = pre:test/buildHardwareTests.py
build_src_filter = -<*> +<adc/>
build_flags =
    ${env:featheresp32.build_flags}
    -Isrc/adc

; Manual bounded acquisition controller; pairs with S3 ads127-dma-check.
[env:ads127-capture-control]
extends = env:ads127-spi-check
custom_test_source = ads127CaptureControl.cpp

; Explicit 60-second memory-capture controller for the P4's 65-second deadline.
; Keep the original S3 capture test at its five-second duration.
[env:ads127-p4-capture-60s]
extends = env:ads127-capture-control
build_flags =
    ${env:ads127-spi-check.build_flags}
    -DADS127_P4_LONG_RUN=1

; Explicit 30-minute ADC controller; pairs with the P4's 1805-second deadline.
[env:ads127-p4-capture-30min]
extends = env:ads127-capture-control
build_flags =
    ${env:ads127-spi-check.build_flags}
    -DADS127_P4_ENDURANCE=1

; External channel-0 analog test; keeps P4 60s profiling receiver unchanged.
; DAC remains disabled at boot and starts only after matching receiver READY.
[env:ads127-p4-dac-60s]
extends = env:ads127-capture-control
build_flags =
    ${env:ads127-spi-check.build_flags}
    -DADS127_P4_LONG_RUN=1
    -DADS127_P4_DAC_TEST=1

; Independent A1->A2 measurement using the same bench DAC generator; no TI control.
[env:bench-dac-loopback]
extends = env:ads127-spi-check
custom_test_source = benchDacLoopback.cpp
build_flags =
    ${env:ads127-spi-check.build_flags}
    -DADS127_P4_DAC_TEST=1

; Simultaneously measure A1->A2 and control the ADS127/P4 RAM capture.
[env:ads127-p4-compare]
extends = env:ads127-p4-dac-60s
build_flags =
    ${env:ads127-p4-dac-60s.build_flags}
    -DADS127_COMPARE_INPUT=1

; Hold DAC code 135 while both ADCs measure fluctuations; no production change.
[env:ads127-p4-constant]
extends = env:ads127-p4-compare
build_flags =
    ${env:ads127-p4-compare.build_flags}
    -DADS127_DAC_CONSTANT=1
