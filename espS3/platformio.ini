; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Build the S3 program separately from Feather. Arduino provides the runtime and
; FreeRTOS; the generic board profile controls flash/layout/toolchain defaults.
; COM4 below is a saved S3 port choice, not a pin assignment. Windows can assign
; it to another board (the current Feather also uses COM4); check before uploading.
[platformio]
extra_configs = test/platformio.ini
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:test/buildHardwareTests.py
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
; SdFat FsVolume supports exFAT and FAT16/FAT32 over our native SDMMC adapter.
lib_deps = greiman/SdFat@2.3.1
; Discover the reusable writer outside the legacy S3 project.
lib_extra_dirs = ../shared

; Let source files include shared project headers without relative paths.
build_flags =
    -I../shared
    -Isrc/backend
    -Itest/hardware
    -Isrc
    -DUSE_BLOCK_DEVICE_INTERFACE=1

; Use only while the attached Feather still runs the older version-2 parser.
; Same sampling code, shorter status frame. Default builds report v5 acquisition and recording status.
[env:legacy-feather]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS3_LEGACY_STATUS=1

