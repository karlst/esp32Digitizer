; Independent ESP-IDF build; never changes the recorder Arduino framework.
[env:sd-read-idf]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
upload_port = COM4
monitor_speed = 115200
build_flags = -DS3_SD_READ_DIAGNOSTIC=1
